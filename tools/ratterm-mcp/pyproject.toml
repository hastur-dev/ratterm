[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratterm-mcp"
version = "0.1.0"
description = "MCP server that launches, sees and drives ratterm over its control API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
# mcp 2.x renamed FastMCP to MCPServer; server.py uses the 2.x name.
dependencies = ["mcp>=2.0"]

[project.scripts]
ratterm-mcp = "ratterm_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ratterm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A test that hangs is the failure mode this package exists to avoid, so keep
# the output terse and the tracebacks short enough to read in a tool result.
addopts = "-q --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = [
    # Tests take fixtures and assert; annotating every one of them adds noise
    # without adding information.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]
