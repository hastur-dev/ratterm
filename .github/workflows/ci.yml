name: CI

on:
  # Every branch, so a push is checked before a pull request exists.
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Tests on multiple platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the project supports, plus an ARM Linux runner.
        # A PTY, a named pipe and a Unix socket behave differently enough that
        # all three have to run the suite, not only compile it.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run doc tests
        run: cargo test --doc

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary executes (Unix)
        if: runner.os != 'Windows'
        run: |
          OUTPUT=$(./target/release/rat --verify)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          EXPECTED="ratterm v${VERSION} verify-ok"
          if [ "$OUTPUT" != "$EXPECTED" ]; then
            echo "ERROR: --verify output mismatch"
            echo "  Expected: $EXPECTED"
            echo "  Got:      $OUTPUT"
            exit 1
          fi
          echo "Binary verification passed: $OUTPUT"

      - name: Verify binary executes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & .\target\release\rat.exe --verify
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $expected = "ratterm v$version verify-ok"
          if ($output -ne $expected) {
            Write-Host "ERROR: --verify output mismatch"
            Write-Host "  Expected: $expected"
            Write-Host "  Got:      $output"
            exit 1
          }
          Write-Host "Binary verification passed: $output"

  # Install script tests on multiple platforms
  install-script:
    name: Install Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Test install.sh syntax (Unix)
        if: runner.os != 'Windows'
        run: |
          # Check bash syntax is valid
          bash -n install.sh
          echo "install.sh syntax OK"

      - name: Test install.sh execution (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x install.sh
          # Run with verbose to test platform detection and script logic
          # The download may fail if no release exists, that's OK for CI
          ./install.sh --verbose 2>&1 || echo "Install script completed (download may fail without release)"

      - name: Test install.ps1 syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Check PowerShell syntax is valid
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw install.ps1), [ref]$null)
          Write-Host "install.ps1 syntax OK"

      - name: Test install.ps1 execution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Run with verbose to test platform detection and script logic
          # The download may fail if no release exists, that's OK for CI
          try {
            .\install.ps1 -VerboseOutput -User
          } catch {
            Write-Host "Install script completed (download may fail without release): $_"
          }

      - name: Test install.bat syntax (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          REM Verify batch file exists and is readable
          if exist install.bat (
            echo install.bat exists and is readable
          ) else (
            echo install.bat not found
            exit /b 1
          )

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit || true  # Don't fail on advisories, just warn

  # MSRV check (Minimum Supported Rust Version)
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Match rust-version in Cargo.toml. Raised from 1.85 because
          # keyring 4 needs 1.88 and kube 4 needs 1.89.
          toolchain: "1.89"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check MSRV
        run: cargo check --all-features

  # Interface scenarios. The same YAML files run on every platform, which is
  # the cross-platform check the project needs: a popup that draws on Linux
  # and not on Windows fails here rather than in someone's terminal.
  scenario:
    name: Scenarios (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scenario-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-scenario-

      # A debug build. The release profile uses fat LTO and one codegen unit,
      # which costs far more time than it saves in a run that renders frames
      # and asserts on text.
      - name: Build binary
        run: cargo build

      - name: Run scenarios
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=./target/debug/rat.exe
          else
            BIN=./target/debug/rat
          fi
          # Exits non-zero when any scenario fails, so no extra assertion is
          # needed here.
          "$BIN" --scenario-dir tests/scenarios \
                 --fixtures tests/fixtures/fleet \
                 --results-dir test-results \
                 --no-update

      # Always, including on failure: a failing scenario writes the snapshot
      # that shows what was on screen, which is the whole point of keeping it.
      - name: Upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  # Proves the control API works on each platform, not only that it compiles
  # there. A named pipe, a Unix socket and a loopback port are three different
  # code paths, and the loopback port is the one this checks everywhere.
  headless-smoke:
    name: Headless smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-
            ${{ runner.os }}-cargo-scenario-

      - name: Build binary
        run: cargo build

      # Start, probe and stop in one step. A process backgrounded in one step
      # is not reliably still there in the next one.
      - name: Drive a headless instance over the control API
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Not errexit: the probe's exit status is wanted, so the instance
          # log can be printed before the step fails.
          set +e -u -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=./target/debug/rat.exe
          else
            BIN=./target/debug/rat
          fi

          # --test-keys enables F2, which opens the SSH manager. The startup
          # frame shows the terminal pane and no host names; the manager is
          # where the fixture fleet appears.
          "$BIN" --headless --api-tcp 47119 \
                 --fixtures tests/fixtures/fleet \
                 --no-update --test-keys > headless.log 2>&1 &
          RAT_PID=$!

          python - <<'PY'
          import json
          import socket
          import sys
          import time
          from pathlib import Path

          ADDRESS = ("127.0.0.1", 47119)
          TOKEN_FILE = Path.home() / ".ratterm" / "api.token"
          # The instance answers from its own event loop and gives up after
          # five seconds; while it is attaching its terminal a frame can pass
          # that. Both numbers below allow for it.
          INSTANCE_TIMEOUT = -32000
          DEADLINE = time.monotonic() + 120


          def open_socket():
              """Connects once the instance is listening."""
              while time.monotonic() < DEADLINE:
                  try:
                      sock = socket.create_connection(ADDRESS, 5)
                  except OSError:
                      time.sleep(0.5)
                      continue
                  sock.settimeout(30)
                  return sock
              sys.exit("the control endpoint never answered")


          sock = open_socket()
          buffer = bytearray()
          counter = 0


          def call(method, params=None):
              """Sends one request and returns the decoded reply."""
              global counter
              counter += 1
              request = {"id": str(counter), "method": method, "params": params or {}}
              sock.sendall(json.dumps(request).encode("utf-8") + b"\n")
              while b"\n" not in buffer:
                  chunk = sock.recv(1 << 20)
                  if not chunk:
                      sys.exit(f"the instance closed the connection during {method}")
                  buffer.extend(chunk)
              index = buffer.find(b"\n")
              line = bytes(buffer[:index])
              del buffer[: index + 1]
              return json.loads(line.decode("utf-8"))


          def result_of(method, params=None):
              """Calls a method and fails the job if it errors."""
              reply = call(method, params)
              if "error" in reply:
                  sys.exit(f"{method} failed: {reply['error']}")
              return reply["result"]


          # The token is read after the connection is accepted: an instance
          # publishes its token and then binds, so a token read earlier can be
          # a previous run's.
          token = TOKEN_FILE.read_text(encoding="utf-8").strip()
          result_of("session.authenticate", {"token": token})
          print("authenticated; version", result_of("system.get_version"))

          # Render until the event loop is warm, so the assertions below are
          # about the interface and not about startup timing.
          while True:
              reply = call("app.snapshot", {})
              if "error" not in reply:
                  break
              if reply["error"].get("code") != INSTANCE_TIMEOUT:
                  sys.exit(f"app.snapshot failed: {reply['error']}")
              if time.monotonic() > DEADLINE:
                  sys.exit("the instance never rendered a frame")

          result_of("app.send_key", {"key": "F2"})
          frame = result_of("app.snapshot", {})
          text = "\n".join(frame["lines"])

          if not text.strip():
              sys.exit("the instance rendered an empty frame")
          if "fixture-gpu" not in text:
              print(text.encode("ascii", "replace").decode("ascii"))
              sys.exit("the fixture fleet is not on screen")

          state = result_of("app.state")
          print("frame", frame["width"], "x", frame["height"], "-", len(text), "chars")
          print("status:", state["status"])
          print("control API works on this platform")

          result_of("system.quit", {"force": True})
          sock.close()
          PY
          STATUS=$?

          # The instance quits itself; kill it only if it is still there.
          for _ in $(seq 1 50); do
            kill -0 "$RAT_PID" 2>/dev/null || break
            sleep 0.2
          done
          kill -9 "$RAT_PID" 2>/dev/null || true

          if [ "$STATUS" -ne 0 ]; then
            echo "--- instance log ---"
            cat headless.log
          fi
          exit "$STATUS"

